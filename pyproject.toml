[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "delase"
version = "1.0"
description = "Delayed Linear Analysis for Stability Estimation (DeLASE)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  {name = "Adam J. Eisen", email = "eisenaj@mit.edu" }
]
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "torch",
  "tqdm",
]

[project.urls]
Homepage = "https://github.com/adamjeisen/DeLASE"
Repository = "https://github.com/adamjeisen/DeLASE"

[project.optional-dependencies]
demo = [
  "jupyter",
  "jupyterlab",
  "matplotlib",
  "scipy",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
]
